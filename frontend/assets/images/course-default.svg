<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <defs>
    <linearGradient id="courseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002b5b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="400" height="225" fill="url(#courseGradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="200" cy="80" r="50" fill="rgba(255,255,255,0.1)"/>
  <circle cx="280" cy="140" r="30" fill="rgba(255,255,255,0.05)"/>
  <circle cx="120" cy="160" r="40" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Иконка книги -->
  <g transform="translate(175, 85)">
    <path d="M20,10 L30,10 L30,50 L20,45 L10,50 L10,10 Z" fill="rgba(255,255,255,0.9)"/>
    <path d="M20,10 L20,45 M20,25 L30,25 M20,35 L30,35" stroke="#1e88e5" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Текст -->
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    COURSE
  </text>
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Образовательная платформа
  </text>
</svg>
